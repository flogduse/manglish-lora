name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pure-pipeline deps (no torch by design)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run dataset-contract tests
        run: pytest tests/ -v
